[project]
name = "rsp-backend"
version = "0.1.0"
description = "Risk / Solution / Project management backend with FMEA support"
readme = "README.md"
authors = [
    { name = "MIZiper", email = "miziper@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.12.5",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
